name: Release

# main = release. Every push to main that changes the app publishes a new
# release, and existing users see it in Settings (UpdateService).
#
# Versioning is automatic: the next version is the latest release with its patch
# number bumped (1.1.0 → 1.1.1). For a minor or major release, set a higher
# CFBundleShortVersionString in Ortus/Info.plist; it wins whenever it's ahead
# of the latest release. The build number is the commit count, so it only grows.
# The version is written into the CI checkout only; nothing is committed back.
#
# Pushes that only touch the landing page, docs or scripts don't release.
# Run the workflow by hand to force a release.
#
# Signing: with the Developer ID secrets below, releases are signed, notarized and
# also published as Ortus.dmg. Without them, CI falls back to an ad-hoc signed zip.
#   DEVELOPER_ID_P12           base64 of the exported "Developer ID Application" .p12
#   DEVELOPER_ID_P12_PASSWORD  its export password
#   NOTARY_KEY                 contents of the App Store Connect API key (.p8)
#   NOTARY_KEY_ID, NOTARY_ISSUER_ID

on:
  push:
    branches: [main]
    paths:
      - "Ortus/**"
      - "Sources/**"
      - "BrowserExtension/**"
      - "Package.swift"
      - "Package.resolved"
      - "build.sh"
  workflow_dispatch:

# Back-to-back merges queue up, so each one sees the release before it.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # macos-15 ships Xcode 16 / Swift 6, which Package.swift requires
    # (swift-tools-version 6.0). macos-14 defaults to Swift 5.10 and can't build it.
    runs-on: macos-15
    env:
      SIGNED: ${{ secrets.DEVELOPER_ID_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for the commit-count build number

      - name: Select Xcode 16 (Swift 6 toolchain)
        run: |
          # macos-15 already defaults to Xcode 16, but select the newest installed
          # Xcode 16.x explicitly rather than hardcode a minor-version bundle name.
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          swift --version

      - name: Pick the next version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PLIST=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Ortus/Info.plist)
          LATEST=$(gh release view --json tagName --jq .tagName 2>/dev/null | sed 's/^v//' || true)
          if [ -z "$LATEST" ]; then
            V=$PLIST
          elif [ "$(printf '%s\n%s\n' "$LATEST" "$PLIST" | sort -V | tail -1)" = "$PLIST" ] && [ "$PLIST" != "$LATEST" ]; then
            V=$PLIST  # manual minor/major bump in Info.plist
          else
            IFS=. read -r MAJOR MINOR PATCH <<< "$LATEST"
            V="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          BUILD=$(git rev-list --count HEAD)
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" Ortus/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" Ortus/Info.plist
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Latest release: ${LATEST:-none} · Info.plist: $PLIST → releasing $V (build $BUILD)"

      - name: Import the Developer ID certificate
        if: env.SIGNED == 'true'
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          # A throwaway keychain, so codesign never waits on a password dialog.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ { print $2; exit }')
          if [ -z "$IDENTITY" ]; then echo "The .p12 has no Developer ID Application identity" >&2; exit 1; fi
          echo "ORTUS_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Build release
        run: |
          if [ "$SIGNED" != true ]; then
            echo "::warning::No Developer ID secrets, so this release is ad-hoc signed and has no dmg."
          fi
          ./build.sh release

      - name: Notarize and package the dmg
        if: env.SIGNED == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/notarize.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=(Ortus-macOS.zip)
          if [ -f Ortus.dmg ]; then ASSETS+=(Ortus.dmg); fi
          gh release create "v${{ steps.ver.outputs.version }}" \
            "${ASSETS[@]}" \
            --title "Ortus ${{ steps.ver.outputs.version }}" \
            --generate-notes
