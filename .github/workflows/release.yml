name: Release

# main = release. Every push to main that changes the app publishes a new
# release, and existing users see it in Settings (UpdateService).
#
# Versioning is automatic: the next version is the latest release with its patch
# number bumped (1.1.0 → 1.1.1). For a minor or major release, set a higher
# CFBundleShortVersionString in Ortus/Info.plist; it wins whenever it's ahead
# of the latest release. The build number is the commit count, so it only grows.
# The version is written into the CI checkout only; nothing is committed back.
#
# Pushes that only touch the landing page, docs or scripts don't release.
# Run the workflow by hand to force a release.

on:
  push:
    branches: [main]
    paths:
      - "Ortus/**"
      - "Sources/**"
      - "BrowserExtension/**"
      - "Package.swift"
      - "Package.resolved"
      - "build.sh"
  workflow_dispatch:

# Back-to-back merges queue up, so each one sees the release before it.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # macos-15 ships Xcode 16 / Swift 6, which Package.swift requires
    # (swift-tools-version 6.0). macos-14 defaults to Swift 5.10 and can't build it.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for the commit-count build number

      - name: Select Xcode 16 (Swift 6 toolchain)
        run: |
          # macos-15 already defaults to Xcode 16, but select the newest installed
          # Xcode 16.x explicitly rather than hardcode a minor-version bundle name.
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          swift --version

      - name: Pick the next version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PLIST=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Ortus/Info.plist)
          LATEST=$(gh release view --json tagName --jq .tagName 2>/dev/null | sed 's/^v//' || true)
          if [ -z "$LATEST" ]; then
            V=$PLIST
          elif [ "$(printf '%s\n%s\n' "$LATEST" "$PLIST" | sort -V | tail -1)" = "$PLIST" ] && [ "$PLIST" != "$LATEST" ]; then
            V=$PLIST  # manual minor/major bump in Info.plist
          else
            IFS=. read -r MAJOR MINOR PATCH <<< "$LATEST"
            V="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          BUILD=$(git rev-list --count HEAD)
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" Ortus/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" Ortus/Info.plist
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Latest release: ${LATEST:-none} · Info.plist: $PLIST → releasing $V (build $BUILD)"

      - name: Build release (ad-hoc signed)
        run: ORTUS_SIGNING_IDENTITY=- ./build.sh release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            Ortus-macOS.zip \
            --title "Ortus ${{ steps.ver.outputs.version }}" \
            --generate-notes
